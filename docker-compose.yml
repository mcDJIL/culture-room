services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ruang_budaya}
      POSTGRES_USER: ${POSTGRES_USER:-ruang_budaya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build: ./backend
    image: ruang-budaya-backend:latest
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ruang_budaya}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ruang_budaya}
    command: ["node", "dist/db/migrate.js"]
    depends_on:
      db:
        condition: service_healthy

  seed:
    build: ./backend
    image: ruang-budaya-backend:latest
    profiles: ["seed"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ruang_budaya}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ruang_budaya}
    command: ["node", "dist/db/seed.js"]
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    image: ruang-budaya-backend:latest
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-ruang_budaya}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ruang_budaya}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
    image: ruang-budaya-frontend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
